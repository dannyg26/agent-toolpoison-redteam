<svg xmlns="http://www.w3.org/2000/svg" width="600" height="298" viewBox="0 0 600 298" role="img">
<title>Paired differences with confidence intervals</title>
<rect x="0.0" y="0.0" width="600.0" height="298.0" fill="#ffffff" stroke="none" rx="0"/>
<text x="20.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2328">Figure 3. Paired difference in solve proportion, 95% CI (post hoc)</text>
<text x="20.0" y="48.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#57606a">Dark: Tango score interval (stage B method). Light: Newcombe hybrid score (method 10).</text>
<line x1="200.0" y1="70" x2="200.0" y2="230" stroke="#d0d7de" stroke-width="1"/>
<text x="200.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#57606a">-0.50</text>
<line x1="290.0" y1="70" x2="290.0" y2="230" stroke="#d0d7de" stroke-width="1"/>
<text x="290.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#57606a">-0.25</text>
<line x1="380.0" y1="70" x2="380.0" y2="230" stroke="#57606a" stroke-width="1"/>
<text x="380.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#57606a">0</text>
<line x1="470.0" y1="70" x2="470.0" y2="230" stroke="#d0d7de" stroke-width="1"/>
<text x="470.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#57606a">+0.25</text>
<line x1="560.0" y1="70" x2="560.0" y2="230" stroke="#d0d7de" stroke-width="1"/>
<text x="560.0" y="248.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#57606a">+0.50</text>
<text x="188.0" y="99.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2328">abliterated vs aligned</text>
<text x="188.0" y="113.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" font-weight="normal" fill="#57606a">primary, 0-1 discordant</text>
<line x1="266.7" y1="91.0" x2="437.3" y2="91.0" stroke="#1f2328" stroke-width="3"/>
<line x1="291.7" y1="101.0" x2="420.1" y2="101.0" stroke="#8c959f" stroke-width="3"/>
<circle cx="354.3" cy="96.0" r="5" fill="#1a7f64"/>
<text x="188.0" y="149.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2328">heretic vs aligned</text>
<text x="188.0" y="163.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" font-weight="normal" fill="#57606a">primary, 1-2 discordant</text>
<line x1="252.7" y1="141.0" x2="457.9" y2="141.0" stroke="#1f2328" stroke-width="3"/>
<line x1="266.9" y1="151.0" x2="447.1" y2="151.0" stroke="#8c959f" stroke-width="3"/>
<circle cx="354.3" cy="146.0" r="5" fill="#1a7f64"/>
<text x="188.0" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="bold" fill="#1f2328">heretic vs abliterated</text>
<text x="188.0" y="213.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="end" font-weight="normal" fill="#57606a">secondary, 1-1 discordant</text>
<line x1="284.4" y1="191.0" x2="475.6" y2="191.0" stroke="#1f2328" stroke-width="3"/>
<line x1="301.9" y1="201.0" x2="458.1" y2="201.0" stroke="#8c959f" stroke-width="3"/>
<circle cx="380.0" cy="196.0" r="5" fill="#1a7f64"/>
<text x="20.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#57606a">Difference = first arm minus second arm, n = 14 tasks, one trajectory each.</text>
<text x="20.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#57606a">Negative values favour the second arm.</text>
</svg>
